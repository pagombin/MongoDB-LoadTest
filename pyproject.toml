[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mongo-load-tester"
version = "0.1.0"
description = "Config-driven MongoDB load and stress testing application with live dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "dash>=2.18.2",
  "faker>=33.0.0",
  "kaleido>=1.0.0",
  "plotly>=6.0.0",
  "pydantic>=2.10.6",
  "pymongo>=4.11.1",
  "pyyaml>=6.0.2",
  "reportlab>=4.2.5",
  "typer>=0.15.1",
  "waitress>=3.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
]

[project.scripts]
mongo-load-tester = "mongo_load_tester.cli:main"

[tool.setuptools.packages.find]
include = ["mongo_load_tester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
