[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ballast"
dynamic = ["version"]
description = "Load testing for MongoDB clusters, built to show what a workload experiences during scale operations."
readme = "README.md"
requires-python = ">=3.10"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp>=3.9",
  "pydantic>=2.5",
  "pymongo>=4.13",
]

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]
schema = ["faker>=20", "pyyaml>=6.0"]
all = ["faker>=20", "pyyaml>=6.0"]
legacy = [
  "dash>=2.18.2",
  "faker>=20",
  "plotly>=6.0.0",
  "pyyaml>=6.0",
  "reportlab>=4.2.5",
  "typer>=0.15.1",
  "waitress>=3.0.0",
]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
  "pip-audit>=2.7",
]

[project.scripts]
ballast = "ballast.cli:main"
mongo-load-tester = "mongo_load_tester.cli:main"

[tool.setuptools.dynamic]
version = {attr = "ballast.product.VERSION"}

[tool.setuptools.packages.find]
include = ["ballast*", "mongo_load_tester*"]

[tool.setuptools.package-data]
ballast = ["web/**/*", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: needs a local MongoDB replica set (BALLAST_TEST_URI)",
  "e2e: browser tests",
  "soak: long-running soak test",
]
addopts = "--import-mode=importlib -m 'not integration and not e2e and not soak'"

[tool.ruff]
line-length = 140
target-version = "py310"
extend-exclude = ["mongo_load_tester"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S110", "S311", "S603", "S607", "E501", "E731", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mongo_load_tester.*"
follow_imports = "skip"
ignore_errors = true
